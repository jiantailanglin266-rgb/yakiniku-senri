openapi: 3.1.0

info:
  title: SalonFlow API
  version: 0.1.0
  description: |
    サロン向け統合業務管理 SaaS の HTTP API。

    Phase 1 で実装済みのエンドポイントのみを定義しています。
    管理画面の操作の多くは Next.js Server Actions で実装されており、
    REST 化は Phase 3 の予定です（docs/api/API.md §3 参照）。

    すべてのレスポンスは `data` または `error` と `requestId` を持つ共通封筒です。
  contact:
    name: SalonFlow
  license:
    name: Proprietary

servers:
  - url: http://localhost:3100
    description: ローカル開発
  - url: https://example.invalid
    description: 本番（未設定のプレースホルダー）

tags:
  - name: public
    description: 認証不要。公開予約ページが使用します。
  - name: files
    description: 署名付き URL による非公開ファイル配信。
  - name: export
    description: データ出力。
  - name: jobs
    description: スケジューラから駆動されるジョブ。

paths:
  /api/v1/public/stores/{storeSlug}/availability:
    get:
      tags: [public]
      summary: 公開の空き枠検索
      description: |
        指定した日から最大 14 日分の空き枠を返します。

        この結果は**非拘束**です。返された枠は次の瞬間に他の顧客に
        取られ得ます。確定は予約作成エンドポイントで再検証されます。
      operationId: getPublicAvailability
      parameters:
        - name: storeSlug
          in: path
          required: true
          schema: { type: string }
          example: demo-beauty-salon-a
        - name: from
          in: query
          required: true
          schema: { type: string, pattern: '^\d{4}-\d{2}-\d{2}$' }
          example: "2026-08-05"
        - name: days
          in: query
          schema: { type: integer, minimum: 1, maximum: 14, default: 7 }
        - name: serviceId
          in: query
          required: true
          description: メニュー ID。複数回指定できます（1〜10 件）。
          schema:
            type: array
            items: { type: string }
          style: form
          explode: true
        - name: optionId
          in: query
          description: オプション ID。複数回指定できます。
          schema:
            type: array
            items: { type: string }
          style: form
          explode: true
        - name: staffId
          in: query
          description: 指名するスタッフ。省略すると全対応スタッフから探します。
          schema: { type: string }
      responses:
        "200":
          description: 空き枠
          headers:
            cache-control:
              schema: { type: string }
              description: 常に no-store
          content:
            application/json:
              schema:
                type: object
                required: [data, requestId]
                properties:
                  data:
                    type: object
                    required: [timeZone, days]
                    properties:
                      timeZone: { type: string, example: Asia/Tokyo }
                      days:
                        type: array
                        items: { $ref: "#/components/schemas/DayAvailability" }
                  requestId: { type: string }
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/ValidationFailed"
        "429":
          $ref: "#/components/responses/RateLimited"

  /api/v1/public/appointments:
    post:
      tags: [public]
      summary: 公開予約の確定
      description: |
        予約を作成します。

        所要時間と料金はサーバー側で再計算され、リクエストの内容は採用されません。
        既存顧客は正規化済みの電話番号またはメールで照合して再利用します
        （氏名だけでは照合しません）。
      operationId: createPublicAppointment
      parameters:
        - name: Idempotency-Key
          in: header
          description: |
            同一キーでの再送は 1 件の予約しか作りません。
            省略するとリクエスト内容のハッシュが使われます。
          schema: { type: string, maxLength: 128 }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateAppointmentRequest" }
      responses:
        "201":
          description: 予約成立
          content:
            application/json:
              schema:
                type: object
                required: [data, requestId]
                properties:
                  data: { $ref: "#/components/schemas/CreatedAppointment" }
                  requestId: { type: string }
        "200":
          description: 冪等キーによる再送。保存済みのレスポンスを返します。
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: "#/components/schemas/CreatedAppointment" }
                  requestId: { type: string }
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: |
            競合。`SLOT_TAKEN`（枠が埋まった）、
            `IDEMPOTENCY_KEY_REUSED`（同じキーで異なる内容）、
            `REQUEST_IN_FLIGHT`（処理中）のいずれか。
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorEnvelope" }
        "422":
          description: |
            業務ルール違反。`STORE_CLOSED`, `OUTSIDE_BUSINESS_HOURS`,
            `BOOKING_CUTOFF_PASSED`, `TOO_FAR_IN_ADVANCE`, `STAFF_UNAVAILABLE`,
            `STAFF_CANNOT_PERFORM`, `RESOURCE_UNAVAILABLE`, `CONTACT_REQUIRED`,
            `VALIDATION_FAILED` のいずれか。
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorEnvelope" }
        "429":
          $ref: "#/components/responses/RateLimited"
        "500":
          $ref: "#/components/responses/ServerError"

  /api/v1/files:
    get:
      tags: [files]
      summary: 署名付き URL による非公開ファイル配信
      description: |
        署名を検証したうえで、**さらにセッションと権限を再確認**します。
        URL が転送されても、権限のない相手には配信されません。
      operationId: getSignedFile
      security:
        - sessionCookie: []
      parameters:
        - name: key
          in: query
          required: true
          schema: { type: string }
        - name: expires
          in: query
          required: true
          description: UNIX 秒
          schema: { type: integer }
        - name: signature
          in: query
          required: true
          description: HMAC-SHA256（base64url）
          schema: { type: string }
      responses:
        "200":
          description: ファイル本体
          content:
            image/jpeg: { schema: { type: string, format: binary } }
            image/png: { schema: { type: string, format: binary } }
            application/pdf: { schema: { type: string, format: binary } }
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          description: 署名不正、または閲覧権限なし
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorEnvelope" }
        "404":
          $ref: "#/components/responses/NotFound"
        "410":
          description: 署名付き URL の期限切れ
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorEnvelope" }
        "501":
          description: ストレージ連携が未設定
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorEnvelope" }

  /api/v1/customers/export:
    get:
      tags: [export]
      summary: 顧客一覧の CSV 出力
      description: |
        `customer.export` 権限が必要です。

        ロールのマスク設定が CSV にも適用されます。
        CSV インジェクション対策として、先頭が `= + - @` タブ CR のセルには
        シングルクォートを前置します。出力は監査ログへ記録されます。
      operationId: exportCustomers
      security:
        - sessionCookie: []
      responses:
        "200":
          description: CSV（UTF-8 BOM 付き）
          content:
            text/csv:
              schema: { type: string }
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          description: customer.export 権限がない
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorEnvelope" }

  /api/v1/jobs/notifications:
    post:
      tags: [jobs]
      summary: 通知アウトボックスの配送
      description: |
        条件付き UPDATE で claim するため、多重起動しても同じ通知を二度送りません。
      operationId: dispatchNotifications
      security:
        - jobToken: []
      responses:
        "200":
          description: 配送結果
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      processed: { type: integer }
                      sent: { type: integer }
                      failed: { type: integer }
                  requestId: { type: string }
        "401":
          $ref: "#/components/responses/Unauthorized"
    get:
      tags: [jobs]
      summary: ジョブトークンの取得（開発環境のみ）
      description: 本番環境では 404 を返します。
      operationId: getJobToken
      responses:
        "200":
          description: トークン
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      token: { type: string }
                  requestId: { type: string }
        "404":
          $ref: "#/components/responses/NotFound"

components:
  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: sf_session
      description: HttpOnly / SameSite=Lax のセッション Cookie
    jobToken:
      type: apiKey
      in: header
      name: x-job-token
      description: SESSION_SECRET から導出した共有シークレット

  schemas:
    DayAvailability:
      type: object
      required: [dateISO, storeClosed, slots]
      properties:
        dateISO:
          type: string
          pattern: '^\d{4}-\d{2}-\d{2}$'
        storeClosed:
          type: boolean
          description: 休業日のときは true。空き枠ゼロとは UI 上区別されます。
        slots:
          type: array
          items:
            type: object
            required: [startAt, staffId]
            properties:
              startAt:
                type: string
                format: date-time
                description: UTC の ISO 8601。表示は店舗タイムゾーンへ変換します。
              staffId:
                type: string

    CreateAppointmentRequest:
      type: object
      required: [storeSlug, serviceIds, staffId, startAt, customer, consent]
      properties:
        storeSlug: { type: string }
        serviceIds:
          type: array
          minItems: 1
          maxItems: 10
          items: { type: string }
        optionIds:
          type: array
          maxItems: 20
          items: { type: string }
        staffId: { type: string }
        startAt: { type: string, format: date-time }
        isDesignated: { type: boolean, default: false }
        customer:
          type: object
          required: [name]
          description: phone と email はどちらか一方が必須です。
          properties:
            name: { type: string, minLength: 1, maxLength: 100 }
            nameKana: { type: string, maxLength: 100 }
            phone: { type: string, maxLength: 40 }
            email: { type: string, format: email, maxLength: 320 }
            note: { type: string, maxLength: 1000 }
        consent:
          type: object
          required: [terms, cancellation, privacy]
          description: すべて true でなければ 422 になります。
          properties:
            terms: { type: boolean, enum: [true] }
            cancellation: { type: boolean, enum: [true] }
            privacy: { type: boolean, enum: [true] }

    CreatedAppointment:
      type: object
      required: [reference, status, startAt, endAt, totalAmount, requiresApproval]
      properties:
        reference:
          type: string
          example: A-20260805-3F9A21
          description: 顧客に提示する予約番号。推測できないランダム接尾辞を持ちます。
        status:
          type: string
          enum: [pending, confirmed]
        startAt: { type: string, format: date-time }
        endAt: { type: string, format: date-time }
        totalAmount:
          type: integer
          description: 最小通貨単位の整数（JPY なら円）。
        requiresApproval:
          type: boolean
          description: 予約リクエスト制の店舗では true。まだ確定していません。
        notificationSent:
          type: boolean
          description: 確認メールをキューに入れたかどうか。

    ErrorEnvelope:
      type: object
      required: [error, requestId]
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code: { type: string }
            message: { type: string }
            details:
              type: array
              items:
                type: object
                properties:
                  path: { type: string }
                  message: { type: string }
        requestId: { type: string }

  responses:
    BadRequest:
      description: リクエスト形式が不正
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorEnvelope" }
    Unauthorized:
      description: 未認証
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorEnvelope" }
    NotFound:
      description: |
        対象が存在しないか、アクセス権がありません。
        両者は意図的に区別しません（区別自体が情報漏えいのため）。
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorEnvelope" }
    ValidationFailed:
      description: 入力検証エラー
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorEnvelope" }
    RateLimited:
      description: レート制限
      headers:
        retry-after:
          schema: { type: integer }
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorEnvelope" }
    ServerError:
      description: 予期しないエラー
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorEnvelope" }
